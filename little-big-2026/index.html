<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta property="og:url" content="http://blog.zahlenpresse.de">
    <meta property="og:title" content="Null Bit Presse">
    <meta property="og:description" content="Verlustfreie Verarbeitung von Bits und Logik.">
    <title>Null Bit Presse</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="shortcut icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" type="text/css" href="/static/css/style.css">
    <link rel="stylesheet" type="text/css" href="/static/css/masonry.css">

    <style>
      :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #24221f; background: #faf8f4; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      .site-header { text-align: center; }
      /* .intro { color: #6b665f; margin: .5rem 0 0; } */
      .day-nav { display: flex; flex-wrap: wrap; justify-content: center; gap: .65rem; margin: 1rem 0 1rem 0; }
      .day-nav a { text-decoration: none; color: inherit; background: white; border: 1px solid #ddd7ce; padding: .5rem .9rem; border-radius: 100px; text-decoration: none; }
      .day-nav a:hover, .day-nav a:focus-visible { background: #24221f; color: white; text-decoration: none; }
      .day-nav a:after { display: none; }
      /* main { max-width: 1120px; margin: auto; } */
      .day { margin: 1rem 0 4rem; scroll-margin-top: 1rem; }
      .day-header { border-bottom: 2px solid #24221f; margin-bottom: 1.2rem; padding-bottom: .65rem; display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
      /*  .day-header h2 { margin: 0; font-size: clamp(1.5rem, 4vw, 2rem); } */
      .day-count { color: #77716a; font-size: .9rem; }
      .panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.25rem; }
      .panel { position: relative; margin: 0; min-width: 0; background: #eee9e1; border: 2px solid #24221f; box-shadow: 5px 5px 0 #24221f; }
      .panel button { display: block; width: 100%; padding: 0; border: 0; background: transparent; cursor: zoom-in; }
      .panel img { display: block; width: 100%; height: auto; }
      .panel-number { position: absolute; top: 10px; left: 10px; background: white; color: #24221f; border: 2px solid #24221f; padding: .25rem .65rem; font-weight: 800; font-size: .95rem; pointer-events: none; }
      .panel figcaption { padding: .5rem .7rem; font-size: .8rem; color: #645e57; }
      /*
      .viewer-top button { background: white; border: 0; border-radius: 4px; padding: .35rem .75rem; cursor: pointer; }
      #viewer-image { display: block; max-width: 100%; max-height: 82vh; width: auto; height: auto; margin: auto; }
      */
      @media (max-width: 640px) { .panels { grid-template-columns: 1fr; } .site-header { padding-top: 2rem; } }
      @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
    </style>
  </head>

  <body>
    <aside></aside>

    <main>
      <header class="site-header">
        <h1 id="site-title">Little Big 2026</h1>
        <nav id="day-nav" class="day-nav" aria-label="Jump to a day"></nav>
      </header>

      <article>
        <div id="comic"></div>
      </article>

      <footer>&copy; 2026 Little Big</footer>
    </main>

    <aside></aside>

    <template id="dialog">
      <dialog>
        <div class="content">
          <div id="lupe" class="magnifier-glass"></div>
          <img class="magnifier-target">
        </div>
      </dialog>
    </template>

    <template id="img">
      <img loading="lazy">
    </template>

    <script type="module">
      import { loadImage, onClick } from "/static/js/masonry.js";
      const BASE = '/static/little-big-2026/';
      const gallery = await import(BASE + 'gallery.js').then((m) => m.default);
      const comic = document.querySelector('#comic');
      const nav = document.querySelector('#day-nav');
      const viewerImage = document.querySelector('#viewer-image');
      const viewerLabel = document.querySelector('#viewer-label');
      const tmpArticle = document.getElementById('comic');
      const tmpImage = document.getElementById('img');
      const tmpDialog = document.getElementById('dialog');

      onClick(tmpArticle, tmpDialog, true);

      if (gallery) {
        document.querySelector('#site-title').textContent = gallery.title || 'Little Big 2026';
        document.title = gallery.title || 'Little Big 2026';

        gallery.topics.reverse().forEach((topic, dayIndex) => {
          const dayId = `day-${dayIndex + 1}`;
          const section = document.createElement('section');
          section.className = 'day';
          section.id = dayId;

          const header = document.createElement('div');
          header.className = 'day-header';
          const heading = document.createElement('h2');
          heading.textContent = topic.title || `Day ${dayIndex + 1}`;

          const count = document.createElement('span');
          count.className = 'day-count';
          header.append(heading, count);
          section.append(header);

          const navLink = document.createElement('a');
          navLink.href = `#${dayId}`;
          navLink.textContent = heading.textContent;
          nav.append(navLink);

          const panels = document.createElement('div');
          panels.className = 'panels';

          topic.images.forEach((path, imageIndex) => {
            loadImage(path, '/static/little-big-2026/', tmpImage, (template) => {
              const figure = document.createElement('figure');
              figure.className = 'panel';

              const button = document.createElement('button');
              button.type = 'button';
              button.setAttribute('aria-label', `Open ${heading.textContent}, panel ${imageIndex + 1}`);

              const number = document.createElement('span');
              number.className = 'panel-number';
              number.textContent = String(imageIndex + 1).padStart(2, '0');

              const clone = template.content.cloneNode(true);
              clone.loading = 'lazy';
              clone.decoding = 'async';
              clone.alt = `${heading.textContent}, panel ${imageIndex + 1}`;
              button.append(clone, number);
              figure.append(button);
              panels.append(figure);
            });
          });

          section.append(panels);
          comic.append(section);
        });
        function moveMagnifier(e) {
    // Hole die exakte Position des Bildes auf dem Bildschirm
    const rect = img.getBoundingClientRect();

    // Berechne die Mausposition relativ zum Bild
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    // Verhindere, dass die Lupe aus dem Bildbereich herauswandert
    if (x > img.width) { x = img.width; }
    if (x < 0) { x = 0; }
    if (y > img.height) { y = img.height; }
    if (y < 0) { y = 0; }

    // Positioniere das Lupenglas zentriert unter dem Mauszeiger
    // (Subtrahiere die Hälfte der Lupenbreite/-höhe)
    glass.style.left = `${x - (glass.offsetWidth / 2)}px`;
    glass.style.top = `${y - (glass.offsetHeight / 2)}px`;

    // Verschiebe den Bildausschnitt innerhalb der Lupe passend zur Position
    const bgX = (x * zoom) - (glass.offsetWidth / 2);
    const bgY = (y * zoom) - (glass.offsetHeight / 2);
    glass.style.backgroundPosition = `-${bgX}px -${bgY}px`;
  }
      }
    </script>
  </body>
</html>
